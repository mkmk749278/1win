name: Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/**'
      - 'configs/**'
      - 'packages/**'
      - 'scripts/**'
      - 'docker-compose.yml'
      - '.env.vps.example'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/mkmk749278/1win-backend
  BOT_WORKER_IMAGE: ghcr.io/mkmk749278/1win-bot-worker
  FRONTEND_IMAGE: ghcr.io/mkmk749278/1win-frontend
  FRONTEND_API_BASE_URL: /api
  FRONTEND_WS_URL: /ws

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push bot-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot-worker/Dockerfile
          push: true
          tags: |
            ${{ env.BOT_WORKER_IMAGE }}:latest
            ${{ env.BOT_WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=${{ vars.FRONTEND_API_BASE_URL || env.FRONTEND_API_BASE_URL }}
            VITE_WS_URL=${{ vars.FRONTEND_WS_URL || env.FRONTEND_WS_URL }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/1win-crash' }}"
            export REPO_URL="${{ vars.REPO_URL || format('https://github.com/{0}.git', github.repository) }}"
            export DEPLOY_BRANCH="${{ github.ref_name }}"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              sudo mkdir -p "$DEPLOY_PATH"
              sudo chown "$USER":"$USER" "$DEPLOY_PATH"
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            echo "${{ secrets.VPS_REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.VPS_REGISTRY_USER }}" --password-stdin

            export IMAGE_TAG="${{ github.sha }}"
            export BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}"
            export BOT_WORKER_IMAGE="${{ env.BOT_WORKER_IMAGE }}"
            export FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}"

            docker compose pull
            docker compose up -d --remove-orphans
            /usr/bin/env bash scripts/healthcheck.sh

      - name: Notify deployment failure
        if: failure() && secrets.DEPLOY_WEBHOOK_URL != ''
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{"text":"1win deployment failed for commit ${{ github.sha }}. Check workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}"

      - name: Summarize deployment status
        if: always()
        run: |
          echo "## Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
