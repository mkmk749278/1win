x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/mkmk749278/1win-backend}:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: ${HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      PREP_MS: ${PREP_MS:-5000}
      TICK_MS: ${TICK_MS:-100}
      CRASH_MIN: ${CRASH_MIN:-1.05}
      CRASH_MAX: ${CRASH_MAX:-15}
      CRASH_HOUSE_EDGE: ${CRASH_HOUSE_EDGE:-0.01}
      CRASH_INSTANT_BUST_PROBABILITY: ${CRASH_INSTANT_BUST_PROBABILITY:-0.03}
    ports:
      - "127.0.0.1:${BACKEND_BIND_PORT:-3001}:3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.BACKEND_PORT ?? 3001) + '/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging: *default-logging
    networks:
      - crash-network

  bot-worker:
    build:
      context: .
      dockerfile: apps/bot-worker/Dockerfile
    image: ${BOT_WORKER_IMAGE:-ghcr.io/mkmk749278/1win-bot-worker}:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKEND_WS_URL: ${BACKEND_WS_URL:-ws://backend:3001/ws}
      BOT_CONFIG_PATH: ${BOT_CONFIG_PATH:-/app/configs/bots/conservative.json}
      BOT_HEALTH_PORT: ${BOT_HEALTH_PORT:-3002}
    volumes:
      - ./configs/bots:/app/configs/bots:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BOT_BIND_HEALTH_PORT:-3002}:${BOT_HEALTH_PORT:-3002}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.BOT_HEALTH_PORT ?? 3002) + '/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - crash-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws}
    image: ${FRONTEND_IMAGE:-ghcr.io/mkmk749278/1win-frontend}:${IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_BIND_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging: *default-logging
    networks:
      - crash-network

networks:
  crash-network:
    driver: bridge
