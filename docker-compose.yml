services:
  backend:
    image: node:24-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @crash/backend dev"
    ports:
      - "3001:3001"
  frontend:
    image: node:24-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @crash/frontend dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
