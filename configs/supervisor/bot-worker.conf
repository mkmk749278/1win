[program:crash-bot-worker]
directory=/opt/1win-crash
command=/usr/bin/node apps/bot-worker/dist/index.js
autostart=true
autorestart=true
stderr_logfile=/var/log/crash-bot.err.log
stdout_logfile=/var/log/crash-bot.out.log
environment=NODE_ENV="production",BOT_CONFIG_PATH="/opt/1win-crash/configs/bots/conservative.json",BACKEND_WS_URL="ws://127.0.0.1:3001/ws"
