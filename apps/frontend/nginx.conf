server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"ok":true}';
    }

    location / {
        try_files $uri /index.html;
    }
}
